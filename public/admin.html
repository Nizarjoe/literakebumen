<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard — LiteraKebumen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F6F3ED;--charcoal:#24231F;--terra:#A6533B;--sand:#D8D0C3;--sage:#687263;--white:#fff;--r:6px;--serif:'DM Serif Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ivory);color:var(--charcoal);font-family:var(--sans);font-size:15px}
a{color:var(--terra);text-decoration:none}
button{font-family:var(--sans);cursor:pointer}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}

/* login */
#login{max-width:380px;margin:12vh auto;padding:32px;background:var(--white);border:1px solid var(--sand);border-radius:var(--r)}
#login h1{font-family:var(--serif);font-size:1.7rem;margin-bottom:4px}
#login .sub{color:var(--sage);font-size:.88rem;margin-bottom:22px}
label{display:block;font-size:.8rem;font-weight:600;margin:12px 0 5px;color:var(--sage)}
.input,.select,.textarea{width:100%;padding:10px 12px;border:1px solid var(--sand);border-radius:var(--r);font-family:var(--sans);font-size:.9rem;background:#fff;color:var(--charcoal)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--terra);outline:none}
.btn{display:inline-block;padding:10px 18px;border-radius:var(--r);border:1px solid var(--charcoal);font-size:.88rem;font-weight:500;background:transparent;color:var(--charcoal)}
.btn:hover{background:var(--charcoal);color:var(--ivory)}
.btn-primary{background:var(--terra);border-color:var(--terra);color:#fff}
.btn-primary:hover{background:#8f4632}
.btn-sm{padding:5px 11px;font-size:.78rem}
.btn-danger{border-color:#9b2c2c;color:#9b2c2c}
.btn-danger:hover{background:#9b2c2c;color:#fff}
.err{color:#9b2c2c;font-size:.85rem;margin-top:12px;display:none}

/* shell */
#shell{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--white);border-right:1px solid var(--sand);padding:22px 0;overflow-y:auto;z-index:40}
.sb-logo{font-family:var(--serif);font-size:1.2rem;padding:0 22px 18px;border-bottom:1px solid var(--sand)}
.sb-logo span{color:var(--terra)}
.sb-nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.sb-nav .grp{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);margin:14px 10px 4px}
.sb-nav a{display:block;padding:9px 12px;border-radius:var(--r);color:var(--charcoal);font-size:.9rem}
.sb-nav a:hover{background:var(--ivory);text-decoration:none}
.sb-nav a.on{background:var(--charcoal);color:var(--ivory)}
.main{margin-left:232px;padding:0 32px 60px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--sand);margin-bottom:28px}
.topbar .who{font-size:.85rem;color:var(--sage)}
.topbar .who b{color:var(--charcoal)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:600;border:1px solid var(--sand)}
.badge.published{background:#e8f0e6;color:#3d5a3a;border-color:#c4d4c0}
.badge.draft{background:#f4efe4;color:#8a6d1f;border-color:#e3d9bd}
.badge.archived{background:#eceae6;color:var(--sage)}
.badge.deleted{background:#f7e6e6;color:#9b2c2c}
h2.pg{font-family:var(--serif);font-size:1.55rem}
.pg-desc{color:var(--sage);font-size:.88rem;margin:4px 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--white);border:1px solid var(--sand);border-radius:var(--r);padding:18px}
.stat b{font-family:var(--serif);font-size:1.9rem;display:block}
.stat span{font-size:.78rem;color:var(--sage)}
.panel{background:var(--white);border:1px solid var(--sand);border-radius:var(--r);padding:20px;margin-bottom:22px}
.panel h3{font-size:1rem;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sage);padding:8px 10px;border-bottom:1px solid var(--sand)}
td{padding:10px;border-bottom:1px solid #efece5;vertical-align:top}
tr:hover td{background:#faf8f4}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--sage);font-size:.82rem}

/* editor */
.ed-grid{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.ed-card{background:var(--white);border:1px solid var(--sand);border-radius:var(--r);padding:20px;margin-bottom:18px}
.ed-card h3{font-size:.95rem;margin-bottom:12px}
.te-toolbar{display:flex;gap:4px;flex-wrap:wrap;border:1px solid var(--sand);border-bottom:none;border-radius:var(--r) var(--r) 0 0;padding:6px;background:#faf8f4}
.te-toolbar button{border:none;background:none;padding:6px 9px;border-radius:4px;font-size:.82rem;color:var(--charcoal)}
.te-toolbar button:hover{background:var(--ivory)}
.te{min-height:280px;border:1px solid var(--sand);border-radius:0 0 var(--r) var(--r);padding:16px;background:#fff;font-size:15px;line-height:1.7}
.te:focus{outline:none;border-color:var(--terra)}
.te p{margin-bottom:.9em}
.te h2,.te h3{font-family:var(--serif);font-weight:400;margin:.8em 0 .4em}
.te blockquote{border-left:3px solid var(--terra);padding-left:14px;color:var(--sage);margin:.9em 0}
.te ul,.te ol{margin:0 0 .9em 1.3em}
.te img{max-width:100%;border-radius:4px;margin:.6em 0}
.te-empty:empty:before{content:attr(data-ph);color:#b6af a2}
.te:empty:before{content:attr(data-ph);color:#b6afa2}
.cover-prev{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r);border:1px solid var(--sand);margin-bottom:10px;background:var(--ivory)}
.actionbar{position:sticky;bottom:0;background:var(--ivory);padding:14px 0;display:flex;gap:10px;border-top:1px solid var(--sand);margin-top:8px}
.save-ind{font-size:.8rem;color:var(--sage);align-self:center}
.med-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.med-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r);border:1px solid var(--sand)}
.drop{border:2px dashed var(--sand);border-radius:var(--r);padding:28px;text-align:center;color:var(--sage);cursor:pointer}
.drop.over{border-color:var(--terra)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--charcoal);color:var(--ivory);padding:11px 18px;border-radius:var(--r);font-size:.86rem;opacity:0;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mob-top{display:none}
@media (max-width:960px){
  .sidebar{display:none}
  .main{margin-left:0;padding:0 16px 60px}
  .mob-top{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--sand);margin-bottom:18px}
  .ed-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h1>LiteraKebumen</h1>
  <div class="sub">Masuk ke dashboard editorial</div>
  <form id="loginForm">
    <label for="l-email">Email</label>
    <input class="input" id="l-email" type="email" required autocomplete="username">
    <label for="l-pass">Kata sandi</label>
    <input class="input" id="l-pass" type="password" required autocomplete="current-password">
    <div class="err" id="l-err"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:18px" type="submit">Masuk</button>
  </form>
</div>

<!-- SHELL -->
<div id="shell">
  <aside class="sidebar">
    <div class="sb-logo">Litera<span>Kebumen</span></div>
    <nav class="sb-nav" id="sbNav">
      <a href="#/dashboard" class="on">Overview</a>
      <a href="#/konten">Semua Konten</a>
      <a href="#/konten?tipe=karya">Karya Tulis</a>
      <a href="#/konten?tipe=review">Review Acara</a>
      <a href="#/konten?status=draft">Draft</a>
      <a href="#/konten?status=archived">Arsip (Archived)</a>
      <div class="grp">Kelola</div>
      <a href="#/kategori">Kategori</a>
      <a href="#/media">Media Library</a>
      <a href="#/aktivitas">Activity Log</a>
      <div class="grp admin-only" style="display:none">Admin</div>
      <a href="#/pengguna" class="admin-only" style="display:none">Pengguna &amp; Peran</a>
    </nav>
  </aside>
  <div class="main">
    <div class="mob-top">
      <div class="sb-logo" style="border:none;padding:0">Litera<span>Kebumen</span></div>
      <button class="btn btn-sm" id="logoutBtn2">Keluar</button>
    </div>
    <div class="topbar">
      <div><h2 class="pg" id="pgTitle">Overview</h2><div class="pg-desc" id="pgDesc"></div></div>
      <div style="text-align:right">
        <div class="who" id="who"></div>
        <button class="btn btn-sm" id="logoutBtn" style="margin-top:8px">Keluar</button>
      </div>
    </div>
    <div id="view"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="/admin.js"></script>
</body>
</html>
